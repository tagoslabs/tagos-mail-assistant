[package]
name = "tagos-mail-assistant-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Local demo MCP server for the Tagos mail assistant"

[[bin]]
name = "tagos-mail-assistant-demo"
path = "src/main.rs"

[dependencies]
tagos-mail-assistant = { path = "../tagos-mail-assistant" }
async-trait = { workspace = true }
rusqlite = { workspace = true }
anyhow = "1"
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
rmcp = { version = "=3.5.0", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tagos-mail-assistant = { path = "../tagos-mail-assistant", features = ["test-support"] }
