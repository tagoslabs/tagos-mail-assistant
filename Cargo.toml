[workspace]
resolver = "2"
members = [
    "crates/tagos-mail-assistant",
    "crates/tagos-mail-assistant-demo",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.89"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "net", "io-std", "signal"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tower = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
http = "1"
http-body-util = "0.1"
